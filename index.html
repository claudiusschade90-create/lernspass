    // ============================================================================
    // HAUPT-KOMPONENTE
    // ============================================================================
    function Lernapp() {
      const [geladen, setGeladen] = useState(false);
      const [profile, setProfile] = useState([]);
      const [aktivId, setAktivId] = useState(null);
      const [aktivDaten, setAktivDaten] = useState({ sterne: 0, richtigeGesamt: 0, themaStats: {}, fragenStatus: {} });
      const [lernwoerter, setLernwoerter] = useState([]);
      const [screen, setScreen] = useState("home");
      const [aktivThemenfeld, setAktivThemenfeld] = useState(null);
      const [pinModus, setPinModus] = useState(null);
      const [pinFolgeScreen, setPinFolgeScreen] = useState(null);
      const [profilMenu, setProfilMenu] = useState(false);
      const [migrationsModal, setMigrationsModal] = useState(false);
      const [altSterne, setAltSterne] = useState(0);
      const [altRichtige, setAltRichtige] = useState(0);
      const [konfessionsModal, setKonfessionsModal] = useState(false);
      const [konfessionsModalNurAuswahl, setKonfessionsModalNurAuswahl] = useState(false);

      // Initialer Lade-Vorgang
      useEffect(() => {
        let vorhandene = ladeProfile();
        const migriertV3 = Storage.get(KEY_MIGRIERT_V3);
        const altDaten = Storage.getJson(KEY_ALT, null);

        // Erst-Setup
        if (vorhandene.length === 0) {
          const migriertV2 = Storage.get(KEY_MIGRIERT_V2);
          if (!migriertV2 && altDaten) {
            setAltSterne(altDaten.sterne || 0);
            setAltRichtige(altDaten.richtigeGesamt || 0);
          }
          setMigrationsModal(true);
          setGeladen(true);
          return;
        }

        // Migration v3: Konfessions-Feld in alte Profile einbauen
        if (!migriertV3) {
          let veraendert = false;
          vorhandene = vorhandene.map((p) => {
            if (typeof p.konfession === "undefined") { veraendert = true; return { ...p, konfession: null }; }
            return p;
          });
          if (veraendert) speichereProfile(vorhandene);
          Storage.set(KEY_MIGRIERT_V3, "1");
        }

        let aktiv = Storage.get(KEY_AKTIV);
        if (!aktiv || !vorhandene.find((p) => p.id === aktiv)) {
          aktiv = vorhandene[0].id;
          Storage.set(KEY_AKTIV, aktiv);
        }
        setProfile(vorhandene);
        setAktivId(aktiv);
        const daten = ladeProfilDaten(aktiv);
        // Migration: fragenStatus ergänzen falls fehlt
        if (!daten.fragenStatus) { daten.fragenStatus = {}; speichereProfilDaten(aktiv, daten); }
        setAktivDaten(daten);
        setLernwoerter(ladeLernwoerter(aktiv));
        setGeladen(true);
      }, []);

      useEffect(() => {
        if (!geladen || !aktivId) return;
        speichereProfilDaten(aktivId, aktivDaten);
      }, [aktivDaten, aktivId, geladen]);

      const profilAnlegen = (name, emoji, konfession, sterneStart = 0, richtigeStart = 0) => {
        const id = neueProfilId();
        const neuesProfil = { id, name, emoji, konfession: konfession || null };
        const neuListe = [...profile, neuesProfil];
        setProfile(neuListe);
        speichereProfile(neuListe);
        const daten = { sterne: sterneStart, richtigeGesamt: richtigeStart, themaStats: {}, fragenStatus: {} };
        speichereProfilDaten(id, daten);
        Storage.set(KEY_AKTIV, id);
        setAktivId(id);
        setAktivDaten(daten);
        setLernwoerter([]);
        return id;
      };

      const migrationAbschliessen = (name, emoji, konfession, mitAltDaten) => {
        profilAnlegen(name, emoji, konfession,
          mitAltDaten ? altSterne : 0,
          mitAltDaten ? altRichtige : 0);
        Storage.set(KEY_MIGRIERT_V2, "1");
        Storage.set(KEY_MIGRIERT_V3, "1");
        Storage.del(KEY_ALT);
        setMigrationsModal(false);
      };

      const profilWechseln = (id) => {
        if (id === aktivId) { setProfilMenu(false); return; }
        setAktivId(id);
        Storage.set(KEY_AKTIV, id);
        const daten = ladeProfilDaten(id);
        if (!daten.fragenStatus) daten.fragenStatus = {};
        setAktivDaten(daten);
        setLernwoerter(ladeLernwoerter(id));
        setScreen("home");
        setProfilMenu(false);
      };

      const profilLoeschen = (id) => {
        if (profile.length <= 1) return;
        Storage.del(keyProfilDaten(id));
        Storage.del(keyLernwoerter(id));
        const neuListe = profile.filter((p) => p.id !== id);
        setProfile(neuListe);
        speichereProfile(neuListe);
        if (id === aktivId) {
          const neu = neuListe[0];
          setAktivId(neu.id);
          Storage.set(KEY_AKTIV, neu.id);
          setAktivDaten(ladeProfilDaten(neu.id));
          setLernwoerter(ladeLernwoerter(neu.id));
        }
      };

      const setzeKonfession = (konfId) => {
        const neuListe = profile.map((p) => p.id === aktivId ? { ...p, konfession: konfId } : p);
        setProfile(neuListe);
        speichereProfile(neuListe);
        setKonfessionsModal(false);
        setKonfessionsModalNurAuswahl(false);
      };

      const antwortVerarbeiten = (frageId, istRichtig) => {
        setAktivDaten((d) => {
          const status = verarbeiteAntwort(frageId, istRichtig, d.fragenStatus || {});
          return {
            ...d,
            sterne: d.sterne + (istRichtig ? 1 : 0),
            richtigeGesamt: d.richtigeGesamt + (istRichtig ? 1 : 0),
            fragenStatus: status,
          };
        });
      };

      const resetProfil = () => {
        setAktivDaten({ sterne: 0, richtigeGesamt: 0, themaStats: {}, fragenStatus: {} });
      };

      const elternEintreten = (folgeScreen) => {
        const gespeicherter = Storage.get(KEY_PIN);
        setPinFolgeScreen(folgeScreen);
        setPinModus(gespeicherter ? "eingabe" : "setup");
      };
      const pinErfolgreich = () => {
        setPinModus(null);
        if (pinFolgeScreen) setScreen(pinFolgeScreen);
        setPinFolgeScreen(null);
      };
      const pinAbbrechen = () => { setPinModus(null); setPinFolgeScreen(null); };

      const aktivesProfil = profile.find((p) => p.id === aktivId);

      // Religion-Klick: wenn keine Konfession → Auswahl-Modal, sonst Themenfeld-Picker
      const oeffneFach = (fach) => {
        if (fach === "religion" && (!aktivesProfil || !aktivesProfil.konfession)) {
          setKonfessionsModalNurAuswahl(true);
          setKonfessionsModal(true);
          return;
        }
        setScreen(`fach_${fach}`);
      };

      const themenfeldOeffnen = (tfId) => {
        setAktivThemenfeld(tfId);
        setScreen("quiz");
      };

      if (!geladen) {
        return <div className="min-h-screen flex items-center justify-center bg-amber-50">
          <div className="text-2xl text-amber-900">Lade…</div>
        </div>;
      }

      if (migrationsModal) {
        return <MigrationsModal
          altSterne={altSterne} altRichtige={altRichtige}
          onFertig={migrationAbschliessen}/>;
      }

      return (
        <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-rose-50">
          <div className="fixed inset-0 pointer-events-none opacity-30"
               style={{ backgroundImage: "radial-gradient(circle at 20% 30%, #fbbf24 0%, transparent 30%), radial-gradient(circle at 80% 70%, #fb923c 0%, transparent 30%)" }}/>
          <div className="relative z-10 max-w-4xl mx-auto p-4 md:p-8">

            {screen === "home" && <HomeScreen
              aktivesProfil={aktivesProfil}
              sterne={aktivDaten.sterne} richtigeGesamt={aktivDaten.richtigeGesamt}
              fragenStatus={aktivDaten.fragenStatus || {}}
              lernwoerter={lernwoerter}
              onFach={oeffneFach} onGarten={() => setScreen("garten")}
              onStatistik={() => setScreen("statistik")}
              onProfilMenu={() => setProfilMenu(true)}
              onEltern={() => elternEintreten("eltern")}/>}

            {(screen === "fach_mathe" || screen === "fach_deutsch" || screen === "fach_hsu" || screen === "fach_religion") && (
              <ThemenfeldPickerScreen
                fach={screen.replace("fach_", "")}
                konfession={aktivesProfil?.konfession}
                fragenStatus={aktivDaten.fragenStatus || {}}
                lernwoerter={lernwoerter}
                onZurueck={() => setScreen("home")}
                onThemenfeld={themenfeldOeffnen}/>
            )}

            {screen === "quiz" && aktivThemenfeld && (
              <QuizScreen
                themenfeldId={aktivThemenfeld}
                fragenStatus={aktivDaten.fragenStatus || {}}
                lernwoerter={lernwoerter}
                onZurueck={() => {
                  const tf = THEMENFELDER.find((t) => t.id === aktivThemenfeld);
                  setScreen(tf ? `fach_${tf.fach}` : "home");
                }}
                onAntwort={antwortVerarbeiten}/>
            )}

            {screen === "garten" && <GartenScreen sterne={aktivDaten.sterne} onZurueck={() => setScreen("home")}/>}
            {screen === "statistik" && <StatistikScreen
              fragenStatus={aktivDaten.fragenStatus || {}}
              lernwoerter={lernwoerter}
              konfession={aktivesProfil?.konfession}
              onZurueck={() => setScreen("home")}/>}

            {screen === "eltern" && <ElternScreen
              aktivProfil={aktivesProfil}
              onZurueck={() => setScreen("home")}
              onLernwoerter={() => setScreen("eltern_lernwoerter")}
              onProfileVerwalten={() => setScreen("eltern_profile")}
              onPinAendern={() => setScreen("eltern_pin")}
              onKonfession={() => { setKonfessionsModalNurAuswahl(false); setKonfessionsModal(true); }}
              onReset={resetProfil}/>}
            {screen === "eltern_lernwoerter" && <LernwoerterScreen
              profilId={aktivId} woerter={lernwoerter}
              onAendern={(neu) => { setLernwoerter(neu); speichereLernwoerter(aktivId, neu); }}
              onZurueck={() => setScreen("eltern")}/>}
            {screen === "eltern_profile" && <ProfileVerwaltenScreen
              profile={profile} aktivId={aktivId}
              onNeu={(name, emoji, konfession) => profilAnlegen(name, emoji, konfession)}
              onLoeschen={profilLoeschen}
              onZurueck={() => setScreen("eltern")}/>}
            {screen === "eltern_pin" && <PinAendernScreen
              onFertig={() => setScreen("eltern")}
              onZurueck={() => setScreen("eltern")}/>}
          </div>

          {profilMenu && <ProfilMenu
            profile={profile} aktivId={aktivId}
            onWechseln={profilWechseln}
            onNeu={() => { setProfilMenu(false); elternEintreten("eltern_profile"); }}
            onSchliessen={() => setProfilMenu(false)}/>}

          {konfessionsModal && <KonfessionsModal
            aktiv={aktivesProfil?.konfession}
            erlaubeSpaeter={konfessionsModalNurAuswahl}
            onWaehlen={setzeKonfession}
            onSpaeter={() => { setKonfessionsModal(false); setKonfessionsModalNurAuswahl(false); }}
            onAbbruch={() => { setKonfessionsModal(false); setKonfessionsModalNurAuswahl(false); }}/>}

          {pinModus && <PinDialog
            modus={pinModus}
            onErfolg={pinErfolgreich}
            onAbbruch={pinAbbrechen}/>}
        </div>
      );
    }

    // ============================================================================
    // MIGRATIONS-MODAL (Erst-Setup mit Konfession)
    // ============================================================================
    function MigrationsModal({ altSterne, altRichtige, onFertig }) {
      const [phase, setPhase] = useState("name");
      const [name, setName] = useState("");
      const [emoji, setEmoji] = useState(PROFIL_EMOJIS[0]);
      const [konfession, setKonfession] = useState(null);
      const hatAltDaten = altSterne > 0 || altRichtige > 0;
      const weiter = () => name.trim() && setPhase("konfession");
      const fertig = () => onFertig(name.trim(), emoji, konfession, hatAltDaten);
      return (
        <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-rose-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 md:p-8 shadow-2xl border-4 border-amber-200 max-w-md w-full" style={{ animation: "fadeIn 0.4s ease-out" }}>
            {phase === "name" && <>
              <div className="text-center">
                <div className="text-6xl mb-2">{emoji}</div>
                <h1 className="text-3xl font-extrabold text-amber-900">Willkommen!</h1>
                <p className="text-amber-700 mt-2">Wie heißt du?</p>
              </div>
              <input type="text" value={name} onChange={(e) => setName(e.target.value)}
                placeholder="Dein Name"
                className="w-full mt-5 px-4 py-3 text-2xl text-center border-4 border-amber-300 rounded-2xl focus:outline-none focus:border-amber-500 text-amber-900 font-bold"
                maxLength={20}/>
              <div className="mt-5">
                <p className="text-center text-amber-700 mb-2 font-semibold">Wähle dein Tier:</p>
                <div className="grid grid-cols-6 gap-2">
                  {PROFIL_EMOJIS.map((e) => (
                    <button key={e} onClick={() => { setEmoji(e); soundKlick(); }}
                      className={`text-3xl p-2 rounded-2xl transition-all ${emoji === e ? "bg-amber-300 scale-110 ring-4 ring-amber-500" : "bg-amber-50 hover:bg-amber-100"}`}>
                      {e}
                    </button>
                  ))}
                </div>
              </div>
              {hatAltDaten && (
                <div className="mt-5 bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-3 text-center text-sm text-emerald-700">
                  Dein bisheriger Stand wird übernommen: <b>{altSterne}</b> Sterne, <b>{altRichtige}</b> richtige Antworten.
                </div>
              )}
              <button onClick={weiter} disabled={!name.trim()}
                className="w-full mt-6 bg-gradient-to-r from-amber-400 to-orange-500 text-white rounded-2xl py-4 text-xl font-bold shadow-lg active:scale-[0.98] transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                Weiter →
              </button>
            </>}
            {phase === "konfession" && <>
              <div className="text-center">
                <h1 className="text-2xl font-extrabold text-amber-900">Religionsunterricht</h1>
                <p className="text-amber-700 mt-2 text-sm">Welchen Unterricht hast du in der Schule? Du kannst das jederzeit ändern.</p>
              </div>
              <div className="mt-4 space-y-2">
                {KONFESSIONEN.map((k) => (
                  <button key={k.id} onClick={() => { setKonfession(k.id); soundKlick(); }}
                    className={`w-full flex items-center gap-3 p-3 rounded-2xl border-4 transition-all ${konfession === k.id ? "bg-amber-100 border-amber-400" : "bg-amber-50 border-transparent hover:bg-amber-100"}`}>
                    <span className="text-3xl">{k.emoji}</span>
                    <span className="font-bold text-amber-900 text-lg flex-1 text-left">{k.name}</span>
                    {konfession === k.id && <IconCheck className="w-6 h-6 text-amber-700"/>}
                  </button>
                ))}
                <button onClick={() => { setKonfession(null); soundKlick(); }}
                  className={`w-full flex items-center gap-3 p-3 rounded-2xl border-4 transition-all ${konfession === null ? "bg-slate-100 border-slate-400" : "bg-slate-50 border-transparent hover:bg-slate-100"}`}>
                  <span className="text-3xl">⏭️</span>
                  <span className="font-bold text-slate-700 text-lg flex-1 text-left">Später entscheiden</span>
                  {konfession === null && <IconCheck className="w-6 h-6 text-slate-700"/>}
                </button>
              </div>
              <button onClick={fertig}
                className="w-full mt-5 bg-gradient-to-r from-amber-400 to-orange-500 text-white rounded-2xl py-4 text-xl font-bold shadow-lg active:scale-[0.98] transition-all">
                Los geht's!
              </button>
            </>}
          </div>
        </div>
      );
    }

    // ============================================================================
    // KONFESSIONS-MODAL (nachträglich ändern oder beim Religion-Klick)
    // ============================================================================
    function KonfessionsModal({ aktiv, erlaubeSpaeter, onWaehlen, onSpaeter, onAbbruch }) {
      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 shadow-2xl max-w-md w-full border-4 border-amber-200"
               style={{ animation: "fadeIn 0.2s ease-out" }}>
            <div className="text-center">
              <h3 className="text-2xl font-extrabold text-amber-900">Religionsunterricht</h3>
              <p className="text-amber-700 mt-2 text-sm">
                {erlaubeSpaeter
                  ? "Welchen Religions- oder Ethikunterricht hast du in der Schule?"
                  : "Konfession für dieses Profil ändern:"}
              </p>
            </div>
            <div className="mt-4 space-y-2">
              {KONFESSIONEN.map((k) => (
                <button key={k.id} onClick={() => { soundKlick(); onWaehlen(k.id); }}
                  className={`w-full flex items-center gap-3 p-3 rounded-2xl border-4 transition-all ${aktiv === k.id ? "bg-amber-100 border-amber-400" : "bg-amber-50 border-transparent hover:bg-amber-100"}`}>
                  <span className="text-3xl">{k.emoji}</span>
                  <span className="font-bold text-amber-900 text-lg flex-1 text-left">{k.name}</span>
                  {aktiv === k.id && <IconCheck className="w-6 h-6 text-amber-700"/>}
                </button>
              ))}
            </div>
            <div className="flex gap-2 mt-4">
              {erlaubeSpaeter && (
                <button onClick={onSpaeter}
                  className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl py-3 font-bold transition-all">
                  Später entscheiden
                </button>
              )}
              <button onClick={onAbbruch}
                className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-2xl py-3 font-bold transition-all">
                Abbruch
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // HOME-SCREEN
    // ============================================================================
    function HomeScreen({ aktivesProfil, sterne, richtigeGesamt, fragenStatus, lernwoerter, onFach, onGarten, onStatistik, onProfilMenu, onEltern }) {
      const naechstesTier = tiere.find((t) => t.schwelle > sterne);
      const richtigePro = useMemo(() => {
        const out = { mathe: 0, deutsch: 0, hsu: 0, religion: 0 };
        Object.entries(fragenStatus).forEach(([id, s]) => {
          const f = FRAGEN_KATALOG[id];
          let fach = null;
          if (f) {
            const tf = THEMENFELDER.find((t) => t.id === f.themenfeld);
            if (tf) fach = tf.fach;
          } else if (id.startsWith("mathe_")) {
            fach = "mathe";
          } else if (id.startsWith("lw_")) {
            fach = "deutsch";
          }
          if (fach && out[fach] !== undefined) out[fach] += s.richtig || 0;
        });
        return out;
      }, [fragenStatus]);
      const religionSichtbar = aktivesProfil?.konfession != null;
      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <button onClick={onProfilMenu}
              className="bg-white rounded-full pl-2 pr-4 py-2 shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center gap-2 border-2 border-amber-200">
              <span className="text-3xl">{aktivesProfil?.emoji}</span>
              <span className="font-bold text-amber-900">{aktivesProfil?.name}</span>
              {aktivesProfil?.konfession && (
                <span className="text-lg" title={konfessionLabel(aktivesProfil.konfession)}>
                  {konfessionEmoji(aktivesProfil.konfession)}
                </span>
              )}
              <IconChevronLeft className="w-4 h-4 text-amber-500 -rotate-90"/>
            </button>
            <button onClick={onEltern} title="Eltern-Modus"
              className="bg-white rounded-2xl px-3 py-2 shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center gap-1 text-amber-700">
              <IconKey className="w-5 h-5"/>
              <span className="hidden md:inline font-semibold text-sm">Eltern</span>
            </button>
          </div>

          <div className="text-center pt-2">
            <h1 className="text-5xl md:text-6xl font-extrabold text-amber-900 tracking-tight">Lernspaß</h1>
            <p className="text-lg text-amber-700 mt-2">2. Klasse · Schwarzwaldtalschule Berg</p>
          </div>

          <div className="bg-white rounded-3xl p-6 shadow-lg border-4 border-amber-200">
            <div className="flex items-center justify-between flex-wrap gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-amber-400 rounded-2xl p-3 shadow-md">
                  <IconStar className="w-8 h-8 text-white" fill="currentColor"/>
                </div>
                <div>
                  <div className="text-4xl font-bold text-amber-900">{sterne}</div>
                  <div className="text-sm text-amber-600">Sterne gesammelt</div>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <IconTrophy className="w-7 h-7 text-orange-500"/>
                <div>
                  <div className="text-2xl font-bold text-orange-700">{richtigeGesamt}</div>
                  <div className="text-sm text-orange-600">richtige Antworten</div>
                </div>
              </div>
            </div>
            {naechstesTier && (
              <div className="mt-4 pt-4 border-t border-amber-100">
                <div className="flex items-center justify-between text-sm">
                  <span className="text-amber-700">
                    Nächstes Tier: <span className="text-2xl">{naechstesTier.emoji}</span> {naechstesTier.name}
                  </span>
                  <span className="font-semibold text-amber-900">noch {naechstesTier.schwelle - sterne} Sterne</span>
                </div>
                <div className="mt-2 h-3 bg-amber-100 rounded-full overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-amber-400 to-orange-500 rounded-full transition-all duration-500"
                       style={{ width: `${Math.min(100, (sterne / naechstesTier.schwelle) * 100)}%` }}/>
                </div>
              </div>
            )}
          </div>

          <div className={`grid grid-cols-1 ${religionSichtbar ? "md:grid-cols-2 lg:grid-cols-4" : "md:grid-cols-3"} gap-4`}>
            <FachKarte titel="Mathe" beschreibung="Rechnen, Einmaleins, Uhr, Geld" icon={<IconCalc className="w-10 h-10"/>}
              farbe="from-sky-400 to-sky-600" richtige={richtigePro.mathe} onClick={() => onFach("mathe")}/>
            <FachKarte titel="Deutsch" beschreibung="Wörter, Sätze, Lernwörter" icon={<IconBook className="w-10 h-10"/>}
              farbe="from-rose-400 to-rose-600" richtige={richtigePro.deutsch} onClick={() => onFach("deutsch")}/>
            <FachKarte titel="HSU" beschreibung="Natur, Tiere, Heimat" icon={<IconLeaf className="w-10 h-10"/>}
              farbe="from-emerald-400 to-emerald-600" richtige={richtigePro.hsu} onClick={() => onFach("hsu")}/>
            {religionSichtbar && (
              <FachKarte titel="Religion" beschreibung={konfessionLabel(aktivesProfil.konfession)} icon={<IconCross className="w-10 h-10"/>}
                farbe="from-violet-400 to-violet-600" richtige={richtigePro.religion} onClick={() => onFach("religion")}/>
            )}
          </div>

          <div className="grid grid-cols-2 gap-4">
            <button onClick={onGarten}
              className="bg-gradient-to-r from-orange-400 via-amber-400 to-yellow-400 text-white rounded-3xl p-5 shadow-lg hover:shadow-xl active:scale-[0.98] transition-all border-4 border-white">
              <div className="flex items-center justify-center gap-2">
                <IconSparkles className="w-7 h-7"/>
                <span className="text-xl md:text-2xl font-bold">Tier-Garten</span>
              </div>
            </button>
            <button onClick={onStatistik}
              className="bg-gradient-to-r from-violet-400 to-fuchsia-500 text-white rounded-3xl p-5 shadow-lg hover:shadow-xl active:scale-[0.98] transition-all border-4 border-white">
              <div className="flex items-center justify-center gap-2">
                <IconChart className="w-7 h-7"/>
                <span className="text-xl md:text-2xl font-bold">Mein Fortschritt</span>
              </div>
            </button>
          </div>
        </div>
      );
    }

    function FachKarte({ titel, beschreibung, icon, farbe, richtige, onClick }) {
      return (
        <button onClick={onClick}
          className={`bg-gradient-to-br ${farbe} text-white rounded-3xl p-6 shadow-lg hover:shadow-2xl active:scale-[0.97] transition-all border-4 border-white text-left`}>
          <div className="flex items-start justify-between">
            <div className="bg-white/25 rounded-2xl p-3">{icon}</div>
            <div className="bg-white/30 rounded-full px-3 py-1 text-sm font-semibold">{richtige} ✓</div>
          </div>
          <h3 className="text-3xl font-bold mt-4">{titel}</h3>
          <p className="text-white/90 mt-1 text-sm">{beschreibung}</p>
        </button>
      );
    }

    function ProfilMenu({ profile, aktivId, onWechseln, onNeu, onSchliessen }) {
      return (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-start justify-center pt-20 p-4" onClick={onSchliessen}>
          <div className="bg-white rounded-3xl p-5 shadow-2xl max-w-sm w-full border-4 border-amber-200"
               style={{ animation: "fadeIn 0.2s ease-out" }}
               onClick={(e) => e.stopPropagation()}>
            <h3 className="text-xl font-bold text-amber-900 text-center mb-3">Wer übt jetzt?</h3>
            <div className="space-y-2">
              {profile.map((p) => (
                <button key={p.id} onClick={() => onWechseln(p.id)}
                  className={`w-full flex items-center gap-3 p-3 rounded-2xl transition-all ${p.id === aktivId ? "bg-amber-200 ring-2 ring-amber-500" : "bg-amber-50 hover:bg-amber-100"}`}>
                  <span className="text-3xl">{p.emoji}</span>
                  <span className="font-bold text-amber-900 text-lg flex-1 text-left">{p.name}</span>
                  {p.konfession && <span className="text-lg">{konfessionEmoji(p.konfession)}</span>}
                  {p.id === aktivId && <IconCheck className="w-5 h-5 text-amber-600"/>}
                </button>
              ))}
            </div>
            <button onClick={onNeu}
              className="w-full mt-3 bg-gradient-to-r from-emerald-400 to-emerald-500 text-white rounded-2xl py-3 font-bold flex items-center justify-center gap-2 active:scale-95 transition-all">
              <IconPlus className="w-5 h-5"/> Neues Profil
            </button>
            <button onClick={onSchliessen}
              className="w-full mt-2 text-amber-700 text-sm py-2 hover:text-amber-900">
              Schließen
            </button>
          </div>
        </div>
      );
    }

    // ============================================================================
    // THEMENFELD-PICKER (Ebene 2)
    // ============================================================================
    function ThemenfeldPickerScreen({ fach, konfession, fragenStatus, lernwoerter, onZurueck, onThemenfeld }) {
      const titelMap = { mathe: "Mathe", deutsch: "Deutsch", hsu: "HSU", religion: "Religion" };
      const themenfelder = useMemo(() => {
        return THEMENFELDER.filter((t) => {
          if (t.fach !== fach) return false;
          if (fach === "religion") return t.konfession === konfession;
          return true;
        });
      }, [fach, konfession]);
      return (
        <div className="space-y-5">
          <div className="flex items-center justify-between">
            <button onClick={onZurueck}
              className="bg-white rounded-2xl px-4 py-3 shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center gap-2">
              <IconChevronLeft className="w-5 h-5"/><IconHome className="w-5 h-5"/>
            </button>
            <h2 className="text-3xl md:text-4xl font-extrabold text-amber-900">{titelMap[fach] || fach}</h2>
            <div className="w-20"/>
          </div>
          <p className="text-center text-amber-700">Wähle ein Thema zum Üben:</p>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {themenfelder.map((t) => (
              <ThemenfeldKarte key={t.id} themenfeld={t}
                fortschritt={fortschrittFuerThemenfeld(t.id, fragenStatus, lernwoerter)}
                onClick={() => onThemenfeld(t.id)}/>
            ))}
          </div>
          {themenfelder.length === 0 && (
            <p className="text-center text-amber-600 italic py-8">Noch keine Themenfelder. Inhalte folgen.</p>
          )}
        </div>
      );
    }

    function fortschrittFuerThemenfeld(tfId, fragenStatus, lernwoerter) {
      let ids = FRAGEN_NACH_THEMENFELD[tfId] || [];
      if (tfId === "deu_lernwoerter") {
        ids = (lernwoerter || []).map((w, i) => `lw_${w.wort}_${i}`);
      }
      if (MATHE_GENERATOREN[tfId]) {
        const sitzt = Object.entries(fragenStatus)
          .filter(([id, s]) => id.startsWith(matheThemenfeldPrefix(tfId)) && (s.box || 1) >= 4).length;
        const geuebt = Object.keys(fragenStatus).filter((id) => id.startsWith(matheThemenfeldPrefix(tfId))).length;
        return { sitzt, geuebt, gesamt: null };
      }
      const sitzt = ids.filter((id) => ((fragenStatus[id]?.box) || 1) >= 4).length;
      const geuebt = ids.filter((id) => fragenStatus[id]).length;
      return { sitzt, geuebt, gesamt: ids.length };
    }

    function matheThemenfeldPrefix(tfId) {
      const map = {
        "mathe_plus_minus": "mathe_plus_",
        "mathe_einmaleins": "mathe_mal_",
        "mathe_zahlen": "mathe_",
        "mathe_uhr": "mathe_uhr_",
        "mathe_geld": "mathe_geld_",
      };
      return map[tfId] || tfId;
    }

    function ThemenfeldKarte({ themenfeld, fortschritt, onClick }) {
      const { sitzt, geuebt, gesamt } = fortschritt;
      const prozent = gesamt && gesamt > 0 ? Math.round((sitzt / gesamt) * 100) : 0;
      return (
        <button onClick={onClick}
          className={`bg-gradient-to-br ${themenfeld.farbe} text-white rounded-3xl p-5 shadow-lg hover:shadow-2xl active:scale-[0.97] transition-all border-4 border-white text-left`}>
          <div className="flex items-start justify-between">
            <span className="text-5xl">{themenfeld.emoji}</span>
            {gesamt !== null && (
              <div className="bg-white/30 rounded-full px-3 py-1 text-xs font-bold">
                {sitzt} / {gesamt} sitzen
              </div>
            )}
            {gesamt === null && geuebt > 0 && (
              <div className="bg-white/30 rounded-full px-3 py-1 text-xs font-bold">
                {sitzt} sitzen · {geuebt} geübt
              </div>
            )}
          </div>
          <h3 className="text-2xl font-bold mt-3">{themenfeld.name}</h3>
          <p className="text-white/90 text-sm mt-1">{themenfeld.beschreibung}</p>
          {gesamt !== null && gesamt > 0 && (
            <div className="mt-3 h-2 bg-white/20 rounded-full overflow-hidden">
              <div className="h-full bg-white rounded-full" style={{ width: `${prozent}%` }}/>
            </div>
          )}
        </button>
      );
    }

    // ============================================================================
    // QUIZ-SCREEN (Ebene 3)
    // ============================================================================
    function QuizScreen({ themenfeldId, fragenStatus, lernwoerter, onZurueck, onAntwort }) {
      const themenfeld = THEMENFELDER.find((t) => t.id === themenfeldId);
      const [aufgabe, setAufgabe] = useState(() => naechsteFrage(themenfeldId, fragenStatus, lernwoerter, []));
      const [letzteIds, setLetzteIds] = useState(() => {
        const erste = naechsteFrage(themenfeldId, fragenStatus, lernwoerter, []);
        return erste ? [erste.id] : [];
      });
      // Bei wiederholtem Mounten (themenfeld-Wechsel): aufgabe und letzteIds sind ueber useState-init schon konsistent
      const [gewaehlt, setGewaehlt] = useState(null);
      const [zeigeFeedback, setZeigeFeedback] = useState(false);
      const [serie, setSerie] = useState(0);
      const [runde, setRunde] = useState({ richtig: 0, gesamt: 0 });
      const [konfetti, setKonfetti] = useState([]);

      const farbe = themenfeld?.farbe?.split(" ")[0]?.replace("from-", "bg-") || "bg-amber-500";
      const farbeHell = farbe.replace("-500", "-100").replace("-400", "-100").replace("-600", "-100");
      const farbeText = farbe.replace("bg-", "text-").replace("-500", "-700").replace("-400", "-700").replace("-600", "-700");

      const naechste = () => {
        const neueAufgabe = naechsteFrage(themenfeldId, fragenStatus, lernwoerter, letzteIds);
        setAufgabe(neueAufgabe);
        setGewaehlt(null);
        setZeigeFeedback(false);
        if (neueAufgabe) {
          setLetzteIds((prev) => [neueAufgabe.id, ...prev.filter((id) => id !== neueAufgabe.id)].slice(0, 5));
        }
      };

      const antworten = (option) => {
        if (zeigeFeedback || !aufgabe) return;
        setGewaehlt(option);
        setZeigeFeedback(true);
        const ist_richtig = String(option) === String(aufgabe.antwort);
        setRunde((r) => ({ richtig: r.richtig + (ist_richtig ? 1 : 0), gesamt: r.gesamt + 1 }));
        onAntwort(aufgabe.id, ist_richtig);
        if (ist_richtig) {
          soundRichtig();
          setSerie((s) => s + 1);
          const neu = Array.from({ length: 12 }, (_, i) => ({
            id: Date.now() + i, x: Math.random() * 100,
            emoji: pick(["⭐", "✨", "🌟", "💫"]), delay: Math.random() * 200,
          }));
          setKonfetti(neu);
          setTimeout(() => setKonfetti([]), 1500);
          if ((serie + 1) % 5 === 0) setTimeout(soundStern, 400);
        } else {
          soundFalsch();
          setSerie(0);
        }
      };

      if (!aufgabe) {
        return (
          <div className="space-y-5">
            <div className="flex items-center justify-between">
              <button onClick={onZurueck} className="bg-white rounded-2xl px-4 py-3 shadow-md flex items-center gap-2">
                <IconChevronLeft className="w-5 h-5"/><IconHome className="w-5 h-5"/>
              </button>
              <div className="w-12"/>
            </div>
            <div className="bg-white rounded-3xl p-8 shadow-md border-4 border-amber-100 text-center">
              <p className="text-xl text-amber-800 font-bold">Hier gibt es noch keine Aufgaben.</p>
              <p className="text-amber-600 mt-2">Bitte Eltern fragen — sie können Lernwörter eintragen oder warten, bis hier Inhalte ergänzt werden.</p>
            </div>
          </div>
        );
      }

      const ist_richtig = gewaehlt !== null && String(gewaehlt) === String(aufgabe.antwort);
      const aktBox = (fragenStatus[aufgabe.id]?.box) || 1;

      return (
        <div className="space-y-4 relative">
          {konfetti.map((k) => (
            <div key={k.id} className="fixed text-3xl pointer-events-none z-50"
                 style={{ left: `${k.x}%`, top: "30%", animation: `confettiFall 1.5s ease-out ${k.delay}ms forwards` }}>
              {k.emoji}
            </div>
          ))}

          <div className="flex items-center justify-between">
            <button onClick={onZurueck} className="bg-white rounded-2xl px-4 py-3 shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center gap-2">
              <IconChevronLeft className="w-5 h-5"/><IconHome className="w-5 h-5"/>
            </button>
            <div className={`${farbe} text-white rounded-2xl px-5 py-3 shadow-md flex items-center gap-2 font-bold`}>
              <span className="text-xl">{themenfeld?.emoji}</span>
              <span>{themenfeld?.name}</span>
            </div>
            <div className="bg-white rounded-2xl px-4 py-3 shadow-md text-amber-900 font-bold">
              {runde.richtig} / {runde.gesamt}
            </div>
          </div>

          {serie >= 2 && (
            <div className="bg-gradient-to-r from-amber-400 to-orange-500 text-white rounded-2xl px-5 py-2 shadow-md text-center font-bold"
                 style={{ animation: "pop 0.4s ease-out" }}>
              🔥 {serie} richtige in Folge!
            </div>
          )}

          <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl border-4 border-amber-200">
            <div className={`${farbeHell} ${farbeText} rounded-2xl p-5 mb-6`}>
              <p className="text-xl md:text-3xl font-bold text-center leading-relaxed">{aufgabe.frage}</p>
              {aufgabe.visualisierung && aufgabe.visualisierung.typ === "uhr" && (
                <div className="mt-4"><AnalogUhr stunde={aufgabe.visualisierung.stunde} minute={aufgabe.visualisierung.minute}/></div>
              )}
              {aufgabe.visualisierung && aufgabe.visualisierung.typ === "muenzen" && (
                <MuenzenAnzeige muenzen={aufgabe.visualisierung.muenzen}/>
              )}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {aufgabe.optionen.map((opt, i) => {
                const gewaehltDiese = String(gewaehlt) === String(opt);
                const richtigeDiese = String(opt) === String(aufgabe.antwort);
                let stil = "bg-white border-amber-300 text-amber-900 hover:border-amber-500 hover:bg-amber-50";
                if (zeigeFeedback) {
                  if (richtigeDiese) stil = "bg-emerald-500 border-emerald-600 text-white";
                  else if (gewaehltDiese) stil = "bg-rose-500 border-rose-600 text-white";
                  else stil = "bg-gray-100 border-gray-300 text-gray-500";
                }
                return (
                  <button key={i} onClick={() => antworten(opt)} disabled={zeigeFeedback}
                    className={`${stil} border-4 rounded-2xl py-5 px-4 text-2xl font-bold shadow-md active:scale-95 transition-all flex items-center justify-center gap-2`}>
                    {zeigeFeedback && richtigeDiese && <IconCheck className="w-7 h-7"/>}
                    {zeigeFeedback && gewaehltDiese && !richtigeDiese && <IconX className="w-7 h-7"/>}
                    {opt}
                  </button>
                );
              })}
            </div>

            {zeigeFeedback && (
              <div className="mt-6 space-y-3" style={{ animation: "pop 0.3s ease-out" }}>
                {ist_richtig ? (
                  <div className="bg-emerald-100 border-4 border-emerald-300 rounded-2xl p-4 text-center">
                    <div className="text-3xl font-bold text-emerald-700 flex items-center justify-center gap-2">
                      <IconStar className="w-8 h-8 text-emerald-500" fill="currentColor"/> Super!
                    </div>
                    <p className="text-emerald-600 mt-1">Ein Stern für dich!</p>
                    {aktBox >= 5 && <p className="text-xs text-emerald-700 mt-1 italic">Diese Frage sitzt! Du siehst sie kaum noch.</p>}
                  </div>
                ) : (
                  <div className="bg-rose-50 border-4 border-rose-200 rounded-2xl p-4">
                    <p className="font-bold text-rose-700 text-center">Nicht ganz!</p>
                    <p className="text-rose-600 text-center mt-1">
                      Richtig wäre: <span className="font-bold">{aufgabe.antwort}</span>
                    </p>
                    {aufgabe.hinweis && (
                      <p className="text-sm text-amber-700 text-center mt-2 italic">💡 {aufgabe.hinweis}</p>
                    )}
                  </div>
                )}
                <button onClick={naechste}
                  className={`${farbe} text-white w-full rounded-2xl py-4 text-xl font-bold shadow-lg hover:shadow-xl active:scale-[0.98] transition-all`}>
                  Nächste Aufgabe →
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============================================================================
    // GARTEN-SCREEN
    // ============================================================================
    function GartenScreen({ sterne, onZurueck }) {
      const freigeschaltet = tiere.filter((t) => t.schwelle <= sterne);
      const gesperrt = tiere.filter((t) => t.schwelle > sterne);
      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <button onClick={onZurueck} className="bg-white rounded-2xl px-4 py-3 shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center gap-2">
              <IconChevronLeft className="w-5 h-5"/><IconHome className="w-5 h-5"/>
            </button>
            <h2 className="text-3xl md:text-4xl font-extrabold text-amber-900">Mein Tier-Garten</h2>
            <div className="bg-amber-400 rounded-2xl px-4 py-3 shadow-md text-white font-bold flex items-center gap-1">
              <IconStar className="w-5 h-5" fill="currentColor"/> {sterne}
            </div>
          </div>
          <div className="bg-gradient-to-b from-sky-200 via-emerald-100 to-amber-100 rounded-3xl p-6 md:p-8 shadow-xl border-4 border-white">
            <p className="text-center text-emerald-800 font-semibold mb-4">
              {freigeschaltet.length} von {tiere.length} Tieren gefunden!
            </p>
            <div className="grid grid-cols-3 md:grid-cols-5 gap-3">
              {freigeschaltet.map((t) => (
                <div key={t.name} className="bg-white rounded-2xl p-3 shadow-md border-2 border-emerald-200 text-center hover:scale-105 transition-transform">
                  <div className="text-5xl md:text-6xl">{t.emoji}</div>
                  <div className="text-xs md:text-sm font-semibold text-emerald-700 mt-2">{t.name}</div>
                </div>
              ))}
              {gesperrt.map((t) => (
                <div key={t.name} className="bg-gray-100 rounded-2xl p-3 shadow-md border-2 border-gray-200 text-center opacity-60">
                  <div className="text-5xl md:text-6xl"><IconLock className="w-10 h-10 mx-auto text-gray-400"/></div>
                  <div className="text-xs md:text-sm font-semibold text-gray-500 mt-2">{t.schwelle} ⭐</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // STATISTIK-SCREEN — mit Box-Verteilung
    // ============================================================================
    function StatistikScreen({ fragenStatus, lernwoerter, konfession, onZurueck }) {
      const themenfelder = useMemo(() => THEMENFELDER.filter((t) => t.fach !== "religion" || t.konfession === konfession), [konfession]);
      const gruppen = useMemo(() => {
        const out = {};
        themenfelder.forEach((tf) => {
          if (!out[tf.fach]) out[tf.fach] = [];
          let ids = FRAGEN_NACH_THEMENFELD[tf.id] || [];
          if (tf.id === "deu_lernwoerter") ids = (lernwoerter || []).map((w, i) => `lw_${w.wort}_${i}`);
          let boxen = [0, 0, 0, 0, 0];
          let geuebt = 0;
          let gesamt = ids.length;
          if (MATHE_GENERATOREN[tf.id]) {
            // Aggregiere alle Mathe-Generator-IDs für dieses Themenfeld
            const prefix = matheThemenfeldPrefix(tf.id);
            const matheIds = Object.keys(fragenStatus).filter((id) => id.startsWith(prefix));
            matheIds.forEach((id) => {
              const b = fragenStatus[id]?.box || 1;
              boxen[b - 1] += 1;
              geuebt += 1;
            });
            gesamt = null; // unbegrenzt
          } else {
            ids.forEach((id) => {
              if (fragenStatus[id]) {
                const b = fragenStatus[id].box || 1;
                boxen[b - 1] += 1;
                geuebt += 1;
              }
            });
          }
          out[tf.fach].push({ ...tf, boxen, geuebt, gesamt });
        });
        return out;
      }, [fragenStatus, lernwoerter, themenfelder]);

      const fachLabel = { mathe: "Mathe", deutsch: "Deutsch", hsu: "HSU", religion: "Religion" };
      const reihenfolge = ["mathe", "deutsch", "hsu", "religion"].filter((f) => gruppen[f] && gruppen[f].length > 0);

      return (
        <div className="space-y-5">
          <div className="flex items-center justify-between">
            <button onClick={onZurueck} className="bg-white rounded-2xl px-4 py-3 shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center gap-2">
              <IconChevronLeft className="w-5 h-5"/><IconHome className="w-5 h-5"/>
            </button>
            <h2 className="text-3xl md:text-4xl font-extrabold text-violet-800">Mein Fortschritt</h2>
            <div className="w-20"/>
          </div>
          <div className="bg-white rounded-2xl p-4 shadow-md border-2 border-amber-100 text-sm text-amber-800">
            <b>So funktioniert's:</b> Jede Frage wandert mit jeder richtigen Antwort eine Stufe hoch. In Stufe 5 (<span className="bg-emerald-300 rounded px-1 font-bold">sitzt</span>) kommt sie kaum noch dran. Bei einer falschen Antwort geht's zurück auf Stufe 1.
          </div>
          {reihenfolge.map((fach) => (
            <div key={fach} className="bg-white rounded-3xl p-5 shadow-md border-4 border-amber-100">
              <h3 className="text-2xl font-extrabold text-amber-900 mb-3">{fachLabel[fach]}</h3>
              <div className="space-y-3">
                {gruppen[fach].map((tf) => (
                  <div key={tf.id} className="space-y-1">
                    <div className="flex items-center justify-between text-sm">
                      <span className="font-semibold text-amber-900 flex items-center gap-2">
                        <span>{tf.emoji}</span> {tf.name}
                      </span>
                      <span className="text-amber-600 text-xs">
                        {tf.gesamt !== null
                          ? <>{tf.geuebt} / {tf.gesamt} geübt</>
                          : <>{tf.geuebt} Aufgaben geübt</>}
                      </span>
                    </div>
                    <BoxBalken boxen={tf.boxen}/>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function BoxBalken({ boxen }) {
      const summe = boxen.reduce((a, b) => a + b, 0);
      if (summe === 0) {
        return <div className="h-3 bg-gray-100 rounded-full italic text-xs text-gray-400 px-2">noch nichts geübt</div>;
      }
      return (
        <div className="flex h-3 rounded-full overflow-hidden bg-gray-100" title={`Stufen 1–5: ${boxen.join(" · ")}`}>
          {boxen.map((n, i) => n > 0 && (
            <div key={i} className={BOX_FARBE[i + 1]}
                 style={{ width: `${(n / summe) * 100}%` }}
                 title={`Stufe ${i + 1} (${BOX_LABEL[i + 1]}): ${n}`}/>
          ))}
        </div>
      );
    }

    // ============================================================================
    // ELTERN-SCREEN
    // ============================================================================
    function ElternScreen({ aktivProfil, onZurueck, onLernwoerter, onProfileVerwalten, onPinAendern, onKonfession, onReset }) {
      return (
        <div className="space-y-5">
          <div className="flex items-center justify-between">
            <button onClick={onZurueck} className="bg-white rounded-2xl px-4 py-3 shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center gap-2">
              <IconChevronLeft className="w-5 h-5"/><IconHome className="w-5 h-5"/>
            </button>
            <h2 className="text-3xl md:text-4xl font-extrabold text-slate-800">Eltern-Modus</h2>
            <div className="w-20"/>
          </div>
          <div className="bg-amber-50 rounded-2xl p-4 border-2 border-amber-200 text-center text-sm text-amber-800">
            Aktives Profil: <span className="font-bold">{aktivProfil?.emoji} {aktivProfil?.name}</span>
            {aktivProfil?.konfession && <span> · {konfessionLabel(aktivProfil.konfession)}</span>}
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <ElternKarte titel="Lernwörter pflegen" beschreibung="Wörter aus dem Schulheft eintragen"
              icon={<IconBook className="w-8 h-8"/>} farbe="from-rose-400 to-rose-600" onClick={onLernwoerter}/>
            <ElternKarte titel="Profile verwalten" beschreibung="Neue Profile anlegen oder löschen"
              icon={<IconUsers className="w-8 h-8"/>} farbe="from-sky-400 to-sky-600" onClick={onProfileVerwalten}/>
            <ElternKarte titel="Religionsunterricht" beschreibung={aktivProfil?.konfession ? konfessionLabel(aktivProfil.konfession) : "nicht gesetzt"}
              icon={<IconCross className="w-8 h-8"/>} farbe="from-violet-400 to-violet-600" onClick={onKonfession}/>
            <ElternKarte titel="PIN ändern" beschreibung="Eltern-PIN neu setzen"
              icon={<IconKey className="w-8 h-8"/>} farbe="from-fuchsia-400 to-fuchsia-600" onClick={onPinAendern}/>
            <ElternKarte titel="Fortschritt zurücksetzen" beschreibung="Sterne und Stufen dieses Profils löschen"
              icon={<IconReset className="w-8 h-8"/>} farbe="from-amber-500 to-orange-600"
              onClick={() => { if (window.confirm(`Wirklich Fortschritt von ${aktivProfil?.name} zurücksetzen? Lernwörter bleiben erhalten.`)) onReset(); }}/>
          </div>
        </div>
      );
    }

    function ElternKarte({ titel, beschreibung, icon, farbe, onClick }) {
      return (
        <button onClick={onClick}
          className={`bg-gradient-to-br ${farbe} text-white rounded-3xl p-5 shadow-lg hover:shadow-xl active:scale-[0.97] transition-all border-4 border-white text-left`}>
          <div className="bg-white/25 rounded-2xl p-3 w-fit">{icon}</div>
          <h3 className="text-xl font-bold mt-3">{titel}</h3>
          <p className="text-white/90 text-sm mt-1">{beschreibung}</p>
        </button>
      );
    }

    // ============================================================================
    // LERNWÖRTER-PFLEGE
    // ============================================================================
    function LernwoerterScreen({ profilId, woerter, onAendern, onZurueck }) {
      const [wort, setWort] = useState("");
      const [d1, setD1] = useState("");
      const [d2, setD2] = useState("");
      const [d3, setD3] = useState("");
      const kannHinzufuegen = wort.trim() && d1.trim() && d2.trim() && d3.trim();

      const hinzufuegen = () => {
        if (!kannHinzufuegen) return;
        const neu = [...woerter, { wort: wort.trim(), distraktoren: [d1.trim(), d2.trim(), d3.trim()] }];
        onAendern(neu);
        setWort(""); setD1(""); setD2(""); setD3("");
      };
      const loeschen = (idx) => {
        if (!window.confirm(`Lernwort "${woerter[idx].wort}" wirklich löschen?`)) return;
        onAendern(woerter.filter((_, i) => i !== idx));
      };

      return (
        <div className="space-y-5">
          <div className="flex items-center justify-between">
            <button onClick={onZurueck} className="bg-white rounded-2xl px-4 py-3 shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center gap-2">
              <IconChevronLeft className="w-5 h-5"/>
            </button>
            <h2 className="text-2xl md:text-3xl font-extrabold text-rose-800">Lernwörter</h2>
            <div className="w-12"/>
          </div>
          <div className="bg-white rounded-3xl p-5 shadow-md border-4 border-rose-100 space-y-3">
            <h3 className="font-bold text-rose-800">Neues Lernwort hinzufügen</h3>
            <p className="text-sm text-amber-700">
              Richtige Schreibweise plus drei plausible falsche Schreibweisen als Ablenker.
            </p>
            <input type="text" placeholder="Richtiges Wort (z. B. 'Schule')"
              value={wort} onChange={(e) => setWort(e.target.value)}
              className="w-full px-4 py-3 text-lg border-2 border-rose-300 rounded-2xl focus:outline-none focus:border-rose-500"
              maxLength={30}/>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
              <input type="text" placeholder="Falsch 1" value={d1} onChange={(e) => setD1(e.target.value)}
                className="px-4 py-3 border-2 border-amber-200 rounded-2xl focus:outline-none focus:border-amber-400" maxLength={30}/>
              <input type="text" placeholder="Falsch 2" value={d2} onChange={(e) => setD2(e.target.value)}
                className="px-4 py-3 border-2 border-amber-200 rounded-2xl focus:outline-none focus:border-amber-400" maxLength={30}/>
              <input type="text" placeholder="Falsch 3" value={d3} onChange={(e) => setD3(e.target.value)}
                className="px-4 py-3 border-2 border-amber-200 rounded-2xl focus:outline-none focus:border-amber-400" maxLength={30}/>
            </div>
            <button onClick={hinzufuegen} disabled={!kannHinzufuegen}
              className="w-full bg-gradient-to-r from-rose-400 to-rose-600 text-white rounded-2xl py-3 font-bold flex items-center justify-center gap-2 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
              <IconPlus className="w-5 h-5"/> Hinzufügen
            </button>
          </div>
          <div className="bg-white rounded-3xl p-5 shadow-md border-4 border-rose-100">
            <h3 className="font-bold text-rose-800 mb-3">Eingetragene Lernwörter ({woerter.length})</h3>
            {woerter.length === 0 ? (
              <p className="text-center text-gray-500 italic py-4">Noch keine Lernwörter eingetragen.</p>
            ) : (
              <div className="space-y-2">
                {woerter.map((w, i) => (
                  <div key={i} className="flex items-center justify-between bg-rose-50 rounded-2xl p-3 border-2 border-rose-100">
                    <div>
                      <div className="font-bold text-rose-800 text-lg">{w.wort}</div>
                      <div className="text-xs text-amber-600 mt-1">
                        Ablenker: {w.distraktoren.join(" · ")}
                      </div>
                    </div>
                    <button onClick={() => loeschen(i)}
                      className="bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-xl p-2 active:scale-95 transition-all">
                      <IconTrash className="w-5 h-5"/>
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============================================================================
    // PROFILE VERWALTEN
    // ============================================================================
    function ProfileVerwaltenScreen({ profile, aktivId, onNeu, onLoeschen, onZurueck }) {
      const [neuName, setNeuName] = useState("");
      const [neuEmoji, setNeuEmoji] = useState(PROFIL_EMOJIS[0]);
      const [neuKonfession, setNeuKonfession] = useState(null);

      const anlegen = () => {
        if (!neuName.trim()) return;
        onNeu(neuName.trim(), neuEmoji, neuKonfession);
        setNeuName(""); setNeuKonfession(null);
      };

      return (
        <div className="space-y-5">
          <div className="flex items-center justify-between">
            <button onClick={onZurueck} className="bg-white rounded-2xl px-4 py-3 shadow-md hover:shadow-lg active:scale-95 transition-all">
              <IconChevronLeft className="w-5 h-5"/>
            </button>
            <h2 className="text-2xl md:text-3xl font-extrabold text-sky-800">Profile</h2>
            <div className="w-12"/>
          </div>
          <div className="bg-white rounded-3xl p-5 shadow-md border-4 border-sky-100">
            <h3 className="font-bold text-sky-800 mb-3">Vorhandene Profile</h3>
            <div className="space-y-2">
              {profile.map((p) => (
                <div key={p.id} className="flex items-center justify-between bg-sky-50 rounded-2xl p-3 border-2 border-sky-100">
                  <div className="flex items-center gap-3 flex-1">
                    <span className="text-3xl">{p.emoji}</span>
                    <div>
                      <div className="font-bold text-amber-900 text-lg flex items-center gap-2">
                        {p.name}
                        {p.id === aktivId && <span className="bg-amber-200 text-amber-800 text-xs font-bold rounded-full px-2 py-0.5">aktiv</span>}
                      </div>
                      {p.konfession && <div className="text-xs text-slate-600">{konfessionLabel(p.konfession)}</div>}
                    </div>
                  </div>
                  {profile.length > 1 && (
                    <button onClick={() => { if (window.confirm(`Profil "${p.name}" wirklich löschen? Alle Sterne und Lernwörter gehen verloren.`)) onLoeschen(p.id); }}
                      className="bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-xl p-2 active:scale-95 transition-all">
                      <IconTrash className="w-5 h-5"/>
                    </button>
                  )}
                </div>
              ))}
            </div>
          </div>
          <div className="bg-white rounded-3xl p-5 shadow-md border-4 border-emerald-100 space-y-3">
            <h3 className="font-bold text-emerald-800">Neues Profil anlegen</h3>
            <input type="text" placeholder="Name" value={neuName} onChange={(e) => setNeuName(e.target.value)}
              className="w-full px-4 py-3 text-lg border-2 border-emerald-300 rounded-2xl focus:outline-none focus:border-emerald-500"
              maxLength={20}/>
            <div>
              <p className="text-sm text-emerald-700 mb-2 font-semibold">Tier wählen:</p>
              <div className="grid grid-cols-6 gap-2">
                {PROFIL_EMOJIS.map((e) => (
                  <button key={e} onClick={() => { setNeuEmoji(e); soundKlick(); }}
                    className={`text-2xl p-2 rounded-2xl transition-all ${neuEmoji === e ? "bg-emerald-300 scale-110 ring-4 ring-emerald-500" : "bg-emerald-50 hover:bg-emerald-100"}`}>
                    {e}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <p className="text-sm text-emerald-700 mb-2 font-semibold">Religionsunterricht (optional):</p>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                {KONFESSIONEN.map((k) => (
                  <button key={k.id} onClick={() => { setNeuKonfession(k.id); soundKlick(); }}
                    className={`p-2 rounded-2xl text-sm font-semibold transition-all ${neuKonfession === k.id ? "bg-amber-200 ring-2 ring-amber-500" : "bg-amber-50 hover:bg-amber-100"}`}>
                    <span className="text-xl">{k.emoji}</span> {k.kurz}
                  </button>
                ))}
              </div>
            </div>
            <button onClick={anlegen} disabled={!neuName.trim()}
              className="w-full bg-gradient-to-r from-emerald-400 to-emerald-600 text-white rounded-2xl py-3 font-bold flex items-center justify-center gap-2 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
              <IconPlus className="w-5 h-5"/> Anlegen
            </button>
          </div>
        </div>
      );
    }

    // ============================================================================
    // PIN-DIALOG
    // ============================================================================
    function PinDialog({ modus, onErfolg, onAbbruch }) {
      const [eingabe, setEingabe] = useState("");
      const [bestaetigung, setBestaetigung] = useState("");
      const [fehler, setFehler] = useState("");
      const [phase, setPhase] = useState(modus === "setup" ? "neu" : "eingabe");

      const druecken = (z) => {
        setFehler("");
        if (phase === "eingabe") {
          if (eingabe.length < 4) {
            const neu = eingabe + z;
            setEingabe(neu);
            if (neu.length === 4) {
              setTimeout(() => {
                const gespeichert = Storage.get(KEY_PIN);
                if (neu === gespeichert) onErfolg();
                else { setFehler("Falscher PIN. Versuch's nochmal."); setEingabe(""); }
              }, 200);
            }
          }
        } else if (phase === "neu") {
          if (eingabe.length < 4) {
            const neu = eingabe + z;
            setEingabe(neu);
            if (neu.length === 4) setTimeout(() => setPhase("bestaetigen"), 200);
          }
        } else if (phase === "bestaetigen") {
          if (bestaetigung.length < 4) {
            const neu = bestaetigung + z;
            setBestaetigung(neu);
            if (neu.length === 4) {
              setTimeout(() => {
                if (neu === eingabe) { Storage.set(KEY_PIN, neu); onErfolg(); }
                else { setFehler("Die beiden PINs stimmen nicht überein."); setEingabe(""); setBestaetigung(""); setPhase("neu"); }
              }, 200);
            }
          }
        }
      };
      const loeschen = () => {
        setFehler("");
        if (phase === "bestaetigen") setBestaetigung(bestaetigung.slice(0, -1));
        else setEingabe(eingabe.slice(0, -1));
      };

      const aktiverWert = phase === "bestaetigen" ? bestaetigung : eingabe;
      const titel = modus === "setup"
        ? (phase === "neu" ? "Eltern-PIN festlegen" : "PIN bestätigen")
        : "Eltern-PIN eingeben";
      const hinweis = modus === "setup"
        ? (phase === "neu" ? "Wähle einen 4-stelligen PIN für den Eltern-Bereich." : "PIN zur Sicherheit nochmal eintippen.")
        : "Vier Ziffern eintippen.";

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 shadow-2xl max-w-sm w-full border-4 border-amber-200" style={{ animation: "fadeIn 0.2s ease-out" }}>
            <div className="text-center">
              <div className="bg-violet-100 rounded-2xl p-3 w-fit mx-auto mb-3">
                <IconKey className="w-8 h-8 text-violet-600"/>
              </div>
              <h3 className="text-xl font-bold text-amber-900">{titel}</h3>
              <p className="text-sm text-amber-700 mt-1 px-4">{hinweis}</p>
            </div>
            <div className="text-4xl tracking-widest text-center mt-5 mb-2 font-mono text-amber-900">
              {[0,1,2,3].map((i) => (
                <span key={i} className={`inline-block mx-1 ${aktiverWert[i] ? "" : "opacity-30"}`}>
                  {aktiverWert[i] ? "●" : "○"}
                </span>
              ))}
            </div>
            {fehler && <p className="text-rose-600 text-center text-sm mb-2 font-semibold">{fehler}</p>}
            <div className="grid grid-cols-3 gap-2 max-w-xs mx-auto">
              {[1,2,3,4,5,6,7,8,9].map((z) => (
                <button key={z} onClick={() => druecken(String(z))}
                  className="bg-amber-100 hover:bg-amber-200 active:scale-95 rounded-2xl h-14 text-2xl font-bold text-amber-900 transition-all">
                  {z}
                </button>
              ))}
              <button onClick={onAbbruch}
                className="bg-gray-100 hover:bg-gray-200 active:scale-95 rounded-2xl h-14 text-amber-700 font-semibold transition-all">
                Abbruch
              </button>
              <button onClick={() => druecken("0")}
                className="bg-amber-100 hover:bg-amber-200 active:scale-95 rounded-2xl h-14 text-2xl font-bold text-amber-900 transition-all">
                0
              </button>
              <button onClick={loeschen}
                className="bg-rose-100 hover:bg-rose-200 active:scale-95 rounded-2xl h-14 text-rose-700 font-bold transition-all">
                ⌫
              </button>
            </div>
          </div>
        </div>
      );
    }

    function PinAendernScreen({ onFertig, onZurueck }) {
      const [phase, setPhase] = useState("neu");
      const [neu, setNeu] = useState("");
      const [bestaetigung, setBestaetigung] = useState("");
      const [fehler, setFehler] = useState("");

      const druecken = (z) => {
        setFehler("");
        if (phase === "neu") {
          if (neu.length < 4) {
            const w = neu + z;
            setNeu(w);
            if (w.length === 4) setTimeout(() => setPhase("bestaetigen"), 200);
          }
        } else if (phase === "bestaetigen") {
          if (bestaetigung.length < 4) {
            const w = bestaetigung + z;
            setBestaetigung(w);
            if (w.length === 4) {
              setTimeout(() => {
                if (w === neu) { Storage.set(KEY_PIN, w); setPhase("erfolg"); setTimeout(onFertig, 1200); }
                else { setFehler("PINs stimmen nicht überein."); setNeu(""); setBestaetigung(""); setPhase("neu"); }
              }, 200);
            }
          }
        }
      };
      const loeschen = () => {
        setFehler("");
        if (phase === "neu") setNeu(neu.slice(0, -1));
        else if (phase === "bestaetigen") setBestaetigung(bestaetigung.slice(0, -1));
      };
      const aktiverWert = phase === "bestaetigen" ? bestaetigung : neu;

      return (
        <div className="space-y-5">
          <div className="flex items-center justify-between">
            <button onClick={onZurueck} className="bg-white rounded-2xl px-4 py-3 shadow-md hover:shadow-lg active:scale-95 transition-all">
              <IconChevronLeft className="w-5 h-5"/>
            </button>
            <h2 className="text-2xl md:text-3xl font-extrabold text-violet-800">PIN ändern</h2>
            <div className="w-12"/>
          </div>
          <div className="bg-white rounded-3xl p-6 shadow-md border-4 border-violet-100 max-w-md mx-auto">
            {phase === "erfolg" ? (
              <div className="text-center py-4">
                <div className="bg-emerald-100 rounded-2xl p-3 w-fit mx-auto mb-3">
                  <IconCheck className="w-10 h-10 text-emerald-600"/>
                </div>
                <p className="text-xl font-bold text-emerald-700">PIN aktualisiert!</p>
              </div>
            ) : (
              <>
                <p className="text-center text-amber-700 mb-4">
                  {phase === "neu" ? "Neuen 4-stelligen PIN eintippen." : "PIN nochmal zur Sicherheit eintippen."}
                </p>
                <div className="text-4xl tracking-widest text-center mb-3 font-mono text-amber-900">
                  {[0,1,2,3].map((i) => (
                    <span key={i} className={`inline-block mx-1 ${aktiverWert[i] ? "" : "opacity-30"}`}>
                      {aktiverWert[i] ? "●" : "○"}
                    </span>
                  ))}
                </div>
                {fehler && <p className="text-rose-600 text-center text-sm mb-2 font-semibold">{fehler}</p>}
                <div className="grid grid-cols-3 gap-2">
                  {[1,2,3,4,5,6,7,8,9].map((z) => (
                    <button key={z} onClick={() => druecken(String(z))}
                      className="bg-amber-100 hover:bg-amber-200 active:scale-95 rounded-2xl h-14 text-2xl font-bold text-amber-900 transition-all">
                      {z}
                    </button>
                  ))}
                  <div></div>
                  <button onClick={() => druecken("0")}
                    className="bg-amber-100 hover:bg-amber-200 active:scale-95 rounded-2xl h-14 text-2xl font-bold text-amber-900 transition-all">
                    0
                  </button>
                  <button onClick={loeschen}
                    className="bg-rose-100 hover:bg-rose-200 active:scale-95 rounded-2xl h-14 text-rose-700 font-bold transition-all">
                    ⌫
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Lernapp />);
  </script>
</body>
</html>
